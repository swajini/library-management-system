<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #333;
        }

        header {
            background: #243b55;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            flex: 1;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #243b55;
            margin-bottom: 10px;
        }

        .form-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-section h2 {
            margin-bottom: 20px;
        }

        .form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            flex: 1;
            min-width: 180px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background: #243b55;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        .books-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #243b55;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        @media (max-width: 700px) {
            .stats {
                flex-direction: column;
            }

            table {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Library Management System</h1>
        <p>Manage books easily and efficiently</p>
    </header>

    <div class="container">

        <div class="stats">
            <div class="card">
                <h2 id="totalBooks">0</h2>
                <p>Total Books</p>
            </div>

            <div class="card">
                <h2 id="availableBooks">0</h2>
                <p>Available Books</p>
            </div>

            <div class="card">
                <h2 id="issuedBooks">0</h2>
                <p>Issued Books</p>
            </div>
        </div>

        <div class="form-section">
            <h2>Add New Book</h2>

            <div class="form">
                <input type="text" id="bookName" placeholder="Book Name">
                <input type="text" id="authorName" placeholder="Author Name">

                <button onclick="addBook()">Add Book</button>
            </div>
        </div>

        <div class="books-section">
            <h2>Book List</h2>

            <table>
                <thead>
                    <tr>
                        <th>Book Name</th>
                        <th>Author</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="bookList">
                </tbody>
            </table>
        </div>

    </div>

    <script>
        let books = [];

        function addBook() {
            const bookName = document.getElementById("bookName").value;
            const authorName = document.getElementById("authorName").value;

            if (bookName === "" || authorName === "") {
                alert("Please enter book name and author name.");
                return;
            }

            const book = {
                name: bookName,
                author: authorName,
                status: "Available"
            };

            books.push(book);

            document.getElementById("bookName").value = "";
            document.getElementById("authorName").value = "";

            displayBooks();
        }

        function displayBooks() {
            const bookList = document.getElementById("bookList");

            bookList.innerHTML = "";

            books.forEach((book, index) => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${book.name}</td>
                    <td>${book.author}</td>
                    <td>${book.status}</td>
                    <td>
                        <button class="delete-btn"
                                onclick="deleteBook(${index})">
                            Delete
                        </button>
                    </td>
                `;

                bookList.appendChild(row);
            });

            updateStats();
        }

        function deleteBook(index) {
            books.splice(index, 1);
            displayBooks();
        }

        function updateStats() {
            document.getElementById("totalBooks").textContent = books.length;

            const available = books.filter(
                book => book.status === "Available"
            ).length;

            const issued = books.filter(
                book => book.status === "Issued"
            ).length;

            document.getElementById("availableBooks").textContent = available;
            document.getElementById("issuedBooks").textContent = issued;
        }
    </script>

</body>
</html>
